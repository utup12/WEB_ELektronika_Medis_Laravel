name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Inspect assistant PHP formatter diff
        run: |
          vendor/bin/pint app/Actions/AnswerPracticeQuestion.php
          git --no-pager diff -- app/Actions/AnswerPracticeQuestion.php

      - name: Run CI Checks
        run: composer ci:check

      - name: Validate pilot interactive JavaScript with a headless DOM mock
        run: node scripts/test_pilot_client.mjs

      - name: Run 28-case AI baseline evaluation (non-gating quality benchmark)
        run: php scripts/evaluate_ai_baseline.php

      - name: Save raw AI evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-baseline-evaluation
          path: build/ai-evaluation/
          if-no-files-found: warn

      - name: Validate browser observation controller syntax
        run: |
          node --check public/js/jobsheet-observations.js
          node --check public/js/jobsheet-frequency-chart.js
          node --check public/js/jobsheet-workspace.js
          node --check public/js/jobsheet-data-quality.js
          node --check public/js/student-profile.js
          node --check public/js/script.js
